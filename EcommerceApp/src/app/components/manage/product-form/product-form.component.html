<div class="flex  flex-col">
   <h1>Add New Product</h1>
   
     <mat-form-field appearance="fill">
       <mat-label>Product Name</mat-label>
       <input matInput formControlName="name" placeholder="Enter product name">
     </mat-form-field>

     <mat-form-field appearance="fill">
       <mat-label>Short Description</mat-label>
       <input matInput formControlName="shortDescription" placeholder="Enter short description">
     </mat-form-field>

     <mat-form-field appearance="fill">
       <mat-label>Description</mat-label>
       <textarea matInput formControlName="Description" placeholder="Enter detailed description"></textarea>
     </mat-form-field>

     <mat-form-field appearance="fill">
       <mat-label>Price</mat-label>
       <input matInput type="number" formControlName="price" placeholder="Enter price">
     </mat-form-field>

     <mat-form-field appearance="fill">
       <mat-label>Amount</mat-label>
       <input matInput type="number" formControlName="Amount" placeholder="Enter amount">
     </mat-form-field>

     <button mat-raised-button color="primary" type="submit">Save Product</button>
     
</div>
